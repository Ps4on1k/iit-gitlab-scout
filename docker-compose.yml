services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-gitlab-scout-backend}
    build: ./backend
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Internal only — not exposed to host, accessed via Caddy
  frontend:
    image: ${FRONTEND_IMAGE:-gitlab-scout-frontend}
    build: ./frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  # Single entrypoint — only service exposed to host
  # HTTP → HTTPS redirect, proxy /api/* → backend, /* → frontend
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend
      - backend

  # dbt — materialized views for dashboard performance
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7
    build:
      context: ./dbt
      dockerfile: Dockerfile
    volumes:
      - ./dbt:/usr/app/dbt
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-gitlab_scout}
      - POSTGRES_USER=${POSTGRES_USER:-gitlab_scout}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dbt"]

  # ClickHouse — OLAP engine for fast analytics queries
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-gitlab_scout}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-changeme}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    profiles: ["analytics"]

  # Dagster — workflow orchestrator (replaces in-process scheduler)
  dagster-webserver:
    build: ./dagster
    ports:
      - "3001:3000"
    environment:
      - DAGSTER_HOME=/app/dagster_project
      - DATABASE_URL=postgresql://gitlab_scout:changeme@postgres:5432/gitlab_scout
    volumes:
      - ./dagster:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dagster"]

  dagster-daemon:
    build: ./dagster
    command: ["dagster", "daemon", "run"]
    environment:
      - DAGSTER_HOME=/app/dagster_project
      - DATABASE_URL=postgresql://gitlab_scout:changeme@postgres:5432/gitlab_scout
    volumes:
      - ./dagster:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dagster"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
  clickhouse_data:
