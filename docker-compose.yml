services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-gitlab-scout-backend}
    build: ./backend
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Internal only — not exposed to host, accessed via Caddy
  frontend:
    image: ${FRONTEND_IMAGE:-gitlab-scout-frontend}
    build: ./frontend
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy

  # Single entrypoint — only service exposed to host
  # HTTP → HTTPS redirect, proxy /api/* → backend, /* → frontend
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
      - "${CADDY_HTTPS_PORT:-8443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend
      - backend

  # dbt — materialized views for dashboard performance
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7
    build:
      context: ./dbt
      dockerfile: Dockerfile
    volumes:
      - ./dbt:/usr/app/dbt
    env_file:
      - .env
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dbt"]

  # Dagster — workflow orchestrator
  dagster:
    build: ./dagster
    ports:
      - "3001:3000"
    env_file:
      - .env
    environment:
      - DAGSTER_HOME=/data/dagster
      - POSTGRES_HOST=postgres
    volumes:
      - dagster_data:/data/dagster
      - ./dagster/dagster_project:/app/dagster_project
      - ./dagster/dagster_project/dagster.yaml:/data/dagster/dagster.yaml:ro
      - ./dbt:/usr/app/dbt
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["dagster"]

  # OAuth2 Proxy — auth gateway for Dagster UI
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.6
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAM: "http://dagster:3000"
      OAUTH2_PROXY_COOKIE_DOMAINS: "${APP_DOMAIN:-localhost}"
      OAUTH2_PROXY_WHITELIST_DOMAINS: "${APP_DOMAIN:-localhost}"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    expose:
      - "4180"
    depends_on:
      - dagster
    profiles: ["dagster"]

volumes:
  pgdata:
  dagster_data:
  caddy_data:
  caddy_config:
  caddy_logs:
