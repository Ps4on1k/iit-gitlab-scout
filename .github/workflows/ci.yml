name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Backend typecheck
        run: cd backend && npx tsc --noEmit

      - name: Frontend typecheck
        run: cd frontend && npx tsc --noEmit

      - name: Backend lint
        run: cd backend && npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gitlab_scout
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: gitlab_scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://gitlab_scout:test_password@localhost:5432/gitlab_scout_test
      JWT_SECRET: test-secret-key-for-ci-pipeline
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      GITLAB_BASE_URL: https://gitlab.com/api/v4
      GITLAB_TOKEN: dummy-token

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Run migrations
        run: cd backend && npm run migrate

      - name: Run tests
        run: cd backend && npm test

  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        run: docker build -t gitlab-scout-backend ./backend

      - name: Build frontend image
        run: docker build -t gitlab-scout-frontend ./frontend
