# docker-compose.ghcr.yml
# Использование: docker compose -f docker-compose.ghcr.yml up -d
# Образы загружаются из GitHub Container Registry

services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/ps4on1k/iit-gitlab-scout-backend:latest
    ports:
      - "3030:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/ps4on1k/iit-gitlab-scout-frontend:latest
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
